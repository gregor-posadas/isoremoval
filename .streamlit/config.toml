[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
# Open Sans everywhere, served with the app (SIL Open Font License).
font = "'Open Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"
headingFont = "'Open Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"
codeFont = "ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
baseFontSize = 18
baseFontWeight = 400
headingFontWeights = [700, 700, 700, 700, 700, 700]
headingFontSizes = ["2.5rem", "1.8rem", "1.35rem", "1.15rem", "1rem", "1rem"]
baseRadius = "0.35rem"
showWidgetBorder = true
linkUnderline = true

[[theme.fontFaces]]
family = "Open Sans"
url = "app/static/fonts/open-sans-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Open Sans"
url = "app/static/fonts/open-sans-latin-700-normal.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "Open Sans"
url = "app/static/fonts/open-sans-latin-400-italic.woff2"
weight = 400
style = "italic"

[[theme.fontFaces]]
family = "Open Sans"
url = "app/static/fonts/open-sans-latin-700-italic.woff2"
weight = 700
style = "italic"

# Light (the default on a first visit): warm paper, near-black ink.
[theme.light]
primaryColor = "#385F96"
backgroundColor = "#f6f2e9"
secondaryBackgroundColor = "#ece6d8"
textColor = "#1b1a17"
linkColor = "#2d4f80"
borderColor = "#857e6e"
dataframeBorderColor = "#d4ccbb"
dataframeHeaderBackgroundColor = "#ece6d8"
codeBackgroundColor = "#ece6d8"
blueColor = "#385F96"
orangeColor = "#B8481A"
redColor = "#9b1c1c"
greenColor = "#1d6b45"
yellowColor = "#8a6d00"

[theme.light.sidebar]
backgroundColor = "#ece6d8"
secondaryBackgroundColor = "#f6f2e9"

# Dark: black paper, white ink. Switch in the menu at the top right, under Settings.
[theme.dark]
primaryColor = "#9EB8DB"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1c1c1c"
textColor = "#ffffff"
linkColor = "#9EB8DB"
borderColor = "#8a8a8a"
dataframeBorderColor = "#3d3d3d"
dataframeHeaderBackgroundColor = "#1c1c1c"
codeBackgroundColor = "#1c1c1c"
blueColor = "#9EB8DB"
orangeColor = "#ff8a4c"
redColor = "#ff8a8a"
greenColor = "#5ccf95"
yellowColor = "#ffe27a"

[theme.dark.sidebar]
backgroundColor = "#121212"
secondaryBackgroundColor = "#000000"
